[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bug-bounty-awareness"
version = "0.11.0"
description = "Authorized security workflow engine with passive traffic analysis"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
abh = "abh.cli:main"

[tool.setuptools.packages.find]
include = ["abh*"]

[tool.setuptools.package-data]
abh = ["web/*.html", "web/*.css", "web/*.js"]
